name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Smoke test MCP server
        run: |
          pnpm dlx @modelcontextprotocol/inspector@2.0.0 --cli \
            node servers/genesys-cloud-architect-mcp.js --method tools/list \
            -e PREVENT_LOGIN=TRUE \
            -e DEPLOY_SCRIPT_PATH=DUMMY_VALUE \
            -e GENESYS_REGION=DUMMY_VALUE \
            -e GENESYS_CLIENT_ID=DUMMY_VALUE \
            -e GENESYS_CLIENT_SECRET=DUMMY_VALUE \
            | node scripts/smoke-test-tools.mjs
