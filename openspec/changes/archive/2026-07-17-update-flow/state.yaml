change: update-flow
created: 2026-07-14
execution_mode: interactive
artifact_store: openspec
delivery_strategy: ask-on-risk
chain_strategy: stacked-to-main

phases:
  explore:
    status: done
    artifact: openspec/changes/archive/2026-07-17-update-flow/exploration.md
  proposal:
    status: done
    artifact: openspec/changes/archive/2026-07-17-update-flow/proposal.md
  specs:
    status: done
    artifact: openspec/changes/archive/2026-07-17-update-flow/specs/update-flow/spec.md
  design:
    status: done
    artifact: openspec/changes/archive/2026-07-17-update-flow/design.md
  tasks:
    status: done
    artifact: openspec/changes/archive/2026-07-17-update-flow/tasks.md
  apply:
    status: partial
    note: >
      Slice A (Phase 1, tasks 1.1-1.5): implemented, fixed after independent
      review found 3 HIGH + 1 MEDIUM bugs, re-verified by a second
      independent review — all 4 confirmed fixed, no regressions.
      Slice B (Phase 2, tasks 2.1-2.5): implemented as one work unit, then
      split into 2 PRs for review-size budget (code vs docs). Independent
      review found 1 CRITICAL bug (update_flow's .refine()-wrapped
      inputSchema made tools/list advertise an empty parameter schema —
      the MCP SDK cannot read .shape off a ZodEffects instance). Fixed by
      reverting to a flat zod shape + manual post-parse validation in the
      handler (matching deploy-flow.ts/flow-dependencies.ts's existing
      pattern), and reverting the types.ts widening that enabled the bug.
      A third independent review, with a real McpServer+Client roundtrip
      over InMemoryTransport, confirmed the fix and no regressions in the
      other 3 tools.
      Tasks 1.6 and 2.6 (empirical verification, real Genesys Cloud org
      "Calidda") now DONE/PARTIALLY DONE: confirmed flowId preserved
      across update (core claim), unlockAsync() correctly fired on 3
      different real failure types, publish:true confirmed to invoke
      publishAsync(). classifyUpdateError() fixed using the real captured
      SDK error text for not-found (by id: HTTP 404
      "architect.flow.not.found"; by name: "no matches"). Empirically
      discovered type-mismatch is unreachable via either checkout path —
      folded into not-found, documented in design.md/tasks.md, not a bug.
      Also fixed an unrelated pre-existing doc bug found along the way:
      sdk-patterns.md documented flow.addVariableString()/Integer()/
      Boolean(), none of which exist in the installed SDK — only the
      generic flow.addVariable(name, type, description?) does.
      locked-by-other-user and the exact architect:flow:edit permission
      name remain unverified (require a second real user / org admin
      changes, explicitly declined by the user for this pass).
    artifact: sdd/update-flow/apply-progress (engram obs id 752)
    prs:
      - url: https://github.com/nilsertv/genesys-cloud-architect/pull/1
        branch: feat/update-flow-slice-a
        title: "feat: add non-destructive updateFlow to deploy-runner (Slice A)"
        base: main
      - url: https://github.com/nilsertv/genesys-cloud-architect/pull/2
        branch: feat/update-flow-slice-b
        title: "feat: add update_flow MCP tool"
        base: feat/update-flow-slice-a
      - url: https://github.com/nilsertv/genesys-cloud-architect/pull/3
        branch: feat/update-flow-slice-b-docs
        title: "docs: document update_flow workflow in write-flow skill"
        base: feat/update-flow-slice-b
    note: >
      All 3 PRs merged to main via merge commit (not squash, to preserve
      SHAs for the stacked feat/read-flow-slice-a branch built on top of
      PR #1): #1 -> 1a1f537, #2 -> c4d5f5e, #3 -> 997c3bf. Merged in order
      after retargeting #2/#3's base to main and forcing a close/reopen to
      trigger ci.yml (its `edited` base-change event isn't in ci.yml's
      default trigger set, only opened/synchronize/reopened are).
  verify:
    status: done
    artifact: openspec/changes/archive/2026-07-17-update-flow/verify-report.md
    note: >
      PASS WITH WARNINGS. Verified against real main (HEAD 121d7eb), not
      feature branches (already deleted/merged). pnpm test 26/26 green, tsc
      --noEmit 0 errors, lint clean, build clean, and confirmed real GitHub
      CI (run 29590331340, the read-flow merge PR that contains the full
      update-flow merge) green including the tools/list smoke test.

      1 CRITICAL (formal, pre-existing, already accepted): Lock Handling's
      "locked-by-other-user" scenarios have zero runtime evidence of any
      kind (no unit test — classifyUpdateError() was never extracted to the
      testable update-helpers.ts module — and no empirical confirmation,
      per this file's own note above requiring a second real OAuth
      identity). Not a regression, not reopened — already an explicit user
      decision (2026-07-16). Does not block archive.

      5 WARNING: (1) classifyUpdateError()'s not-found branch was
      empirically confirmed once but has no persisted regression test: (2)
      update-flow.ts has no dedicated test file, unlike read-flow.ts (which
      added a schema regression test citing update_flow's original bug but
      only covering read_flow); the CI smoke test does catch the
      empty-schema bug class for update_flow specifically, just not the
      exact required-keys/validation-message contract; (3) design.md's Open
      Questions checkboxes were never updated to reflect the partial
      not-found/type-mismatch resolution; (4) spec.md's Flow Identifier
      Resolution requirement still names the `.refine()` mechanism that was
      deliberately reverted; (5) skills/write-flow/references/examples/
      workflow.md still uses the non-existent addVariableString() that task
      2.4 claimed to have corrected (only sdk-patterns.md was actually
      fixed).

      2 SUGGESTION: openspec/config.yaml's testing section is stale
      (predates this change's node:test addition); tasks.md 1.3's
      documented test script string no longer matches package.json
      (superseded by a later read-flow-era fix, d1cff39).

      Confirmed with real evidence (git diff, not assumption) that the
      read-flow merge's reordering of src/mcp-server/index.ts (inserting
      read_flow's registration after update_flow's) only added lines and
      touched nothing in update_flow's block.
  archive:
    status: done
    note: "Archived 2026-07-17. Spec synced to openspec/specs/update-flow/, all artifacts moved to archive/2026-07-17-update-flow/."

open_decisions:
  - id: tool-surface
    question: "New dedicated update_flow MCP tool vs mode param on deploy_flow"
    recommendation: "New dedicated tool"
    confirmed: true
    decision: "new-tool"
  - id: test-strategy
    question: "Narrow node:test extraction vs full vitest install vs no tests"
    recommendation: "Narrow node:test extraction, scoped to new update logic only"
    confirmed: true
    decision: "narrow-node-test"
  - id: pr-slicing
    question: "Slice A (deploy-runner core + tests) then Slice B (MCP tool + skill docs)"
    recommendation: "Two slices as scoped in exploration.md"
    confirmed: true
    decision: "two-slices-stacked-to-main"
