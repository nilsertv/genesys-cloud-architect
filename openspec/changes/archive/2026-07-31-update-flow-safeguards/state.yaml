    note: >
      All 25/25 tasks complete, including the 4 empirical real-org tasks
      (1.6, 2.5, 3.9, 3.10) — run against org "Calidda", flow
      `ZZZ-SDD-Test-DoNotUse-UpdateFlow` (flowId
      `69cd3550-0848-4fd7-a5c7-4be615b20ced`), same disposable flow reused
      from `update-flow`/`read-flow`'s original verification. Findings:
      repeated exports of an unmodified flow are byte-identical (1.6);
      `variables` array elements are wrapper-shaped
      (`{stringVariable:{name,...}}`), so `diffFlowYaml` correctly falls
      back to index-based keying, confirmed directly in a real
      `requestedDiff` (2.5); the full two-call protocol was confirmed
      end-to-end against the real API for BOTH the clean-publish-attempt
      path and the hard-block path (simulated drift via a tampered
      persisted baseline file), with correct `errorKind`,
      `unrequestedPaths`, baseline preservation, and unlock behavior in
      both cases (3.9); `.mcp.json` has no `cwd` override, so the MCP
      server inherits Claude Code's own `process.cwd()` at spawn time,
      confirmed via config inspection (3.10). One real bug found and fixed
      during this empirical pass: the CLI's `--flow-file` guard didn't
      exempt `--mode update --confirm-publish` (which never uses a flow
      file) — fixed in `index.ts`; the MCP tool's production path was
      unaffected. Re-verified `pnpm test` (55/55), typecheck, lint clean
      after the fix. Phase 1 (PR1, work unit 1):
      baseline envelope write/read/delete + flowId path-traversal
      sanitization + `yaml` dependency, all TDD RED->GREEN, tests/typecheck/
      lint pass. Branch `update-flow-safeguards-pr1` off `main`, no PR
      opened yet (not requested). Task 1.6 (empirical real-org export
      byte-stability check) is blocked — no live Genesys Cloud org access in
      this sandboxed apply session; deferred to a session with real
      credentials. Phase 2 (PR2, work unit 2): `diffFlowYaml` structural
      diff engine + `evaluateFlowDiffGate` + exported
      `KNOWN_VOLATILE_FLOW_PATHS` (ships empty per design.md fallback), all
      TDD RED->GREEN, tests/typecheck/lint pass. Branch
      `update-flow-safeguards-pr2` off `update-flow-safeguards-pr1`
      (stacked-to-main), no PR opened yet. Task 2.5 (empirical real-org
      confirmation of stable name/id array keys) is blocked for the same
      reason as 1.6 — does not block Phase 3 since the index-based fallback
      degrades safely (more conservative, never less). Phase 3 (PR3, work
      unit 3): two-call wiring in `index.ts` (`updateFlow()` call-1 baseline
      capture, new `confirmAndPublishFlow()` call-2 verify+publish gate,
      `classifyUpdateError()` errorKind precedence, CLI `--confirm-publish`/
      `--exports-dir`), `update-flow.ts` breaking schema change
      (`publish` removed, `confirmPublish` added, no compat alias, diff
      summary + block-reason surfaced in responses), `.gitignore` (`exports/`),
      `skills/write-flow/SKILL.md` + `references/gotchas.md` rewritten for
      the two-call protocol. Branch `update-flow-safeguards-pr3` off
      `update-flow-safeguards-pr2` (stacked-to-main). Added
      `update-flow.test.ts` (tools/list schema regression guard, same
      pattern as `read-flow.test.ts`) — TDD RED confirmed by stashing the
      schema change and re-running, then GREEN on restore. Tests
      (55/55)/typecheck/lint all pass. Tasks 3.9/3.10 (empirical end-to-end
      two-call flow against a real org; `process.cwd()` reliability under
      the plugin launch model) are BLOCKED for the same reason as 1.6/2.5 —
      no live org/plugin-launch environment in this sandboxed session. See
      `pr3-size-exception` below for a size overage requiring user
      confirmation before this PR is merge-ready.
