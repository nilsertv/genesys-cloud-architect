open_decisions:
  - id: same-name-vs-fork
    question: "\"Mismo nombre o nueva versión\" — Genesys auto-versiona cada checkIn/publish bajo el mismo flowId, eso no es una elección posible. La elección real es: editar in-place vs. fork a un flujo nuevo con otro nombre."
    recommendation: "Editar in-place (no agregar soporte de fork en este cambio)"
    confirmed: true
    decision: "edit-in-place-no-fork"
  - id: baseline-persistence
    question: "¿Dónde vive el export/baseline capturado antes de editar?"
    recommendation: "Solo en memoria del proceso"
    confirmed: true
    decision: "persisted-to-disk"
    note: "Usuario pidió explícitamente persistencia a disco en <project-root>/exports/, no en memoria. sdd-propose/design deben definir naming, cleanup y staleness policy para esta carpeta."
  - id: diff-gate-posture
    question: "¿Qué pasa si el diff detecta cambios no solicitados antes de publicar?"
    recommendation: "Bloquear sin excepción"
    confirmed: true
    decision: "hard-block-no-override"
  - id: publish-confirmation-mechanism
    question: "¿Cómo se confirma antes de publicar (mismo flujo, cambios revisados)?"
    recommendation: "Protocolo de dos llamadas (llamar sin publish, mostrar diff, re-invocar con flag explícito)"
    confirmed: true
    decision: "two-call-explicit-flag"
  - id: baseline-file-naming
    question: "¿Cómo se nombra el archivo de baseline en exports/?"
    recommendation: "Por flowId (exports/<flowId>.baseline.yaml)"
    confirmed: true
    decision: "by-flow-id"
  - id: diff-gate-scope
    question: "¿Qué debe detectar exactamente el diff antes de publicar?"
    recommendation: "Solo concurrencia (drift de terceros entre llamada 1 y 2)"
    confirmed: true
    decision: "strict-full-baseline-diff"
    note: >
      CORRECCIÓN sobre lo que proposal.md asumió inicialmente ("optimistic-concurrency
      check", solo drift de terceros entre las 2 llamadas). El usuario confirmó
      explícitamente la opción "Más estricto": el diff debe comparar el flujo editado
      contra el baseline ORIGINAL completo (capturado en la llamada 1, antes de
      cualquier edición), para detectar si la PROPIA edición del usuario tocó algo
      fuera de lo solicitado — no solo si un tercero modificó el flujo mientras tanto.
      Esto es el requisito #5 original del usuario en su forma más literal. sdd-propose
      debe corregir la sección de diff-gate de proposal.md para reflejar esto; sdd-spec/
      sdd-design deben resolver cómo expresar "lo solicitado" de forma comparable (dado
      que nada en el código expresa intención declarada hoy — ver riesgo ya anotado en
      exploration.md) y cómo evitar falsos positivos por campos que Genesys regenera
      automáticamente en cada export.
  - id: baseline-cleanup-policy
    question: "¿Cuándo se borra el archivo de baseline en exports/?"
    recommendation: "Solo al publicar con éxito, sin TTL"
    confirmed: true
    decision: "delete-on-success-only-no-ttl"
  - id: pr2-size-exception
    question: "PR2 (diffFlowYaml + evaluateFlowDiffGate) midió 479 líneas reales, sobre el presupuesto de 400 (ask-on-risk). ¿Aceptar excepción o partir en dos?"
    recommendation: "Aceptar excepción — diffFlowYaml y evaluateFlowDiffGate están directamente acoplados (el gate consume el diff), partirlos sería artificial"
    confirmed: true
    decision: "size-exception-accepted"
    note: "PR2 ya está confirmado (commit df208b0) como una sola unidad. No se reescribe el historial."
  - id: publish-flag-removal
    question: "¿El parámetro `publish: boolean` de update_flow se elimina por completo (breaking change, siempre 2 llamadas), o se mantiene como atajo de compatibilidad que ejecuta ambas llamadas internamente?"
    recommendation: "Eliminar por completo, forzar siempre las 2 llamadas"
    confirmed: true
    decision: "remove-publish-force-two-calls"
    note: >
      Usuario confirmó explícitamente: sin atajo de compatibilidad. `publish: boolean`
      se elimina del schema de `update_flow`; el protocolo de dos llamadas
      (confirmPublish) es obligatorio siempre, sin excepción. skills/write-flow/SKILL.md
      debe reescribir cualquier ejemplo que use `publish: true` (p.ej. bot-flow-testing).
      Scope confirmado limitado a `update_flow` exclusivamente — no toca `deploy_flow`/
      `createFlow<Type>Async` (creación de flujos nuevos), que queda sin cambios.
  - id: pr3-size-exception
    question: "PR3 (wiring de dos llamadas en index.ts + breaking change en update-flow.ts + docs + update-flow.test.ts nuevo) midió ~654 líneas reales (git diff --stat contra update-flow-safeguards-pr2), muy por encima del presupuesto de 400 y también por encima del rango estimado en tasks.md (~350-420, riesgo Alto ya anticipado). ¿Aceptar excepción, o partir en sub-PRs (p.ej. 3a: wiring index.ts/update-flow.ts; 3b: update-flow.test.ts + docs)?"
    recommendation: "Aceptar excepción — igual que PR2 (pr2-size-exception), el wiring de las dos llamadas en index.ts, el breaking change de update-flow.ts, y el test de regresión del schema (mismo patrón que read-flow.test.ts, crítico dado el bug histórico ZodEffects) están todos acoplados al mismo contrato de protocolo; partirlos en sub-PRs sería artificial y dejaría un sub-PR con wiring sin su test de regresión de schema."
    confirmed: true
    decision: "size-exception-accepted"
    note: >
      Usuario confirmó excepción de tamaño para PR3 (commit 20efebb, ~654
      líneas de código). Igual que pr2-size-exception: el wiring de las dos
      llamadas en index.ts, el breaking change de update-flow.ts, el test de
      regresión de schema, y la documentación del mismo contrato están
      directamente acoplados — partirlos en sub-PRs hubiera dejado un
      sub-PR con wiring sin su test de regresión de schema. Ver
      apply-progress.md para el desglose exacto de líneas por archivo.
      usuario debe decidir antes de abrir el PR en GitHub (que todavía no se
      abrió en esta sesión): (a) aceptar la excepción de tamaño, o (b) pedir
      que se divida en sub-PRs sobre esta misma rama. El commit local en
      `update-flow-safeguards-pr3` SÍ se hizo (siguiendo la instrucción
      explícita de esta sesión de apply de terminar con un commit real), pero
      queda pendiente de esta confirmación antes de abrir el PR/mergear.
