change: read-flow
created: 2026-07-16
execution_mode: interactive
artifact_store: openspec
delivery_strategy: ask-on-risk
chain_strategy: stacked-to-main

phases:
  explore:
    status: done
    note: >
      No exploration.md file was created for this change (deliberately,
      per user request). Full exploration summary was captured inline in
      the sdd-propose launch prompt and used as the sole source for this
      proposal — no persisted exploration artifact exists.
    artifact: none
  proposal:
    status: done
    artifact: openspec/changes/read-flow/proposal.md
  specs:
    status: done
    artifact: openspec/changes/read-flow/specs/read-flow/spec.md
  design:
    status: done
    artifact: openspec/changes/read-flow/design.md
  tasks:
    status: done
    artifact: openspec/changes/read-flow/tasks.md
    note: >
      3 work units (Slice A core / Slice B tool MCP / Slice C docs+empirical),
      not 2 like update-flow — read-flow.ts alone (mirrors update-flow.ts's
      spawn+NDJSON boilerplate) plus its own tools/list schema test already
      rounds ~360-400 lines; adding docs on top would risk exceeding the
      400-line budget. Precedent: update-flow's own Slice B was split into
      2 PRs (code vs docs) mid-apply for the same reason (see
      update-flow/state.yaml apply note) — planning the 3rd slice up front
      here instead of discovering it during apply.
  apply:
    status: partial
    note: >
      Slice A (Phase 1, tasks 1.1-1.6) complete on branch
      feat/read-flow-slice-a: truncateContent() helper + tests (16/16
      green), readFlow() + `--mode read` in the deploy-runner, empirically
      verified against the real "Calidda" org (same disposable test flow
      used by update-flow: ZZZ-SDD-Test-DoNotUse-UpdateFlow, flowId
      69cd3550-0848-4fd7-a5c7-4be615b20ced). Confirmed: (a) full valid
      YAML export (2297 chars, well under MAX_YAML_CHARS, truncated:false),
      (b) NO lock acquired — a --mode update checkout run immediately
      after the read succeeded cleanly against the same flow, proving
      loadFlowByFlowIdAsync never took a lock for readFlow to leave
      behind. Also confirmed empirically: not-found classification works
      unchanged in read mode; flowVersion:"published" against a
      never-published flow errors explicitly ("... version 'published' is
      missing. (not.found)") rather than silently falling back, though
      classifyUpdateError() currently files this under "unknown" (regex
      doesn't match the literal "(not.found)" pattern) — left for Slice C
      to re-confirm end-to-end and decide if it needs its own errorKind.
      architect:flow:view permission still NOT isolated (same limitation
      already documented for update-flow's architect:flow:edit) — all
      calls succeeded under the org's current OAuth client role, deferred
      to Slice C per open_decisions.architect-flow-view-permission.

      Deviation from design.md found during verification: exportToObjectAsync's
      awaited Promise value was undefined against a real flow even though
      the SDK logged successful export generation — the real
      {content, fileName} only arrives via the callback parameter.
      readFlow() reads it from there instead of the awaited return value.

      IMPORTANT branch-base correction: the orchestrator's instruction to
      branch from origin/main was factually incorrect — update-flow (PRs
      #1-3) is NOT merged into main (verified: commit 0382e5e is not an
      ancestor of origin/main or local main; main's index.ts has no mode
      dispatch or update-helpers.ts). sdd-apply created feat/read-flow-slice-a
      from feat/update-flow-slice-b-docs (the full 3-PR update-flow stack)
      since that's where resolveFlowIdentifier and the mode dispatch exist.

      Orchestrator follow-up (post-apply, same session): verified that
      update-helpers.ts, update-helpers.test.ts, index.ts, and
      bin/deploy-runner.js are byte-identical between feat/update-flow-slice-a
      (PR #1, already CI-green after the trailing-comma ci.yml fix) and
      feat/update-flow-slice-b-docs (PR #3 tip) — Slices B/C of update-flow
      only touched the MCP tool layer and skill docs, never the deploy-runner.
      So read-flow's Slice A only genuinely depends on PR #1, not the full
      stack. Ran `git rebase --onto feat/update-flow-slice-a
      feat/update-flow-slice-b-docs feat/read-flow-slice-a` — clean,
      zero conflicts (identical trees on the touched files), new commit
      SHAs 319c433/6dba9e3/cf39948. Re-ran pnpm test (16/16), pnpm exec tsc
      --noEmit (0 errors), pnpm run build (clean) post-rebase to confirm
      no regression. feat/read-flow-slice-a now depends only on
      feat/update-flow-slice-a — its eventual PR should target
      feat/update-flow-slice-a (PR #1's branch) rather than the full
      update-flow stack, and can be re-targeted to main directly once
      PR #1 merges.

      Slice B (Phase 2, tasks 2.1-2.4) complete, same branch
      feat/read-flow-slice-a: src/mcp-server/tools/read-flow.ts (flat
      ZodRawShape, no .refine(), spawn+NDJSON mirroring update-flow.ts,
      readOnlyHint:true/destructiveHint:false), registered in
      src/mcp-server/index.ts, and src/mcp-server/tools/read-flow.test.ts
      (McpServer+Client over InMemoryTransport, 6 tests: tools/list schema
      shape + required + annotations, callTool cross-field validation with
      2 distinct messages). pnpm test 26/26 green (20 prior + 6 new), tsc
      --noEmit 0 errors, build clean, lint clean.

      Deviation (branch-state, not a design flaw): design.md says to
      register read_flow immediately after update_flow in index.ts, but
      update_flow (update-flow's Slice B) does not exist on this branch —
      feat/read-flow-slice-a only depends on feat/update-flow-slice-a
      (Slice A/PR #1, deploy-runner core only), per the branch-base
      correction already recorded above for Slice A. read_flow was
      registered after test_bot_flow (the last existing tool on this
      branch) with an inline comment flagging the pending re-order once
      both branches converge — update-flow.ts was deliberately NOT
      cherry-picked in to avoid duplicating another PR's work here.

      Bugfix found and applied (blocking task 2.4's own verification, not
      scope creep): package.json's "test" script
      (`node --experimental-strip-types --test src/**/*.test.ts`) relied on
      shell globstar expansion that plain `sh` (what npm/pnpm scripts run
      under) does not support recursively — it silently matched only
      src/deploy-runner/*.test.ts (1 level deep) and skipped
      src/mcp-server/tools/read-flow.test.ts (2 levels deep) with exit 0,
      no error. Fixed to
      `node --experimental-strip-types --test $(find src -name '*.test.ts' | sort)`,
      verified to pick up all 26 tests with no false positives (Node's own
      `--test` auto-discovery without an explicit path was tried first but
      rejected — it accidentally executes src/mcp-server/tools/test-bot-flow.ts
      as an empty test suite because its filename matches Node's default
      `test-*` naming convention, an unrelated false positive). Note:
      .github/workflows/ci.yml on this branch (inherited from
      update-flow-slice-a) does not invoke `pnpm test` yet — that step was
      only added in update-flow-slice-b-docs (commit f316a2e, not yet on
      this branch) — so this bug was not silently breaking CI today, but
      would have affected local verification and any future CI once
      branches converge.

      Slice C (docs + final empirical verification via the full MCP tool)
      still pending.
  verify:
    status: pending
  archive:
    status: pending

open_decisions:
  - id: tool-name
    question: "Nombre del nuevo tool MCP de solo lectura (candidatos: get_flow, read_flow, export_flow)"
    recommendation: "read_flow"
    confirmed: true
    decision: "read_flow"
  - id: flow-format-param
    question: "¿Exponer flowFormat como parámetro (yaml/architect) o fijarlo siempre en yaml?"
    recommendation: "Solo yaml — no exponer 'architect' como opción, sin caso de uso claro para este propósito"
    confirmed: true
    decision: "yaml-fixed-not-exposed"
  - id: size-guard-strategy
    question: "Estrategia de guard de tamaño para flows grandes/complejos exportados a YAML"
    recommendation: "Diferir a sdd-design/sdd-spec, no bloquea el proposal"
    confirmed: true
    decision: "truncate-at-MAX_YAML_CHARS-200000-with-truncated-flag; starting value to validate empirically in sdd-apply"
  - id: resolve-flow-identifier-sharing
    question: "Reutilizar resolveFlowIdentifier tal cual (update-helpers.ts) vs. extraerlo a un módulo neutral compartido entre read y update"
    recommendation: "Diferir a sdd-design; decisión menor, solo 2 consumidores hoy"
    confirmed: true
    decision: "reuse-as-is-from-update-helpers-no-extraction"
  - id: architect-flow-view-permission
    question: "Confirmar empíricamente que loadFlowBy...Async solo requiere architect:flow:view (no edit/unlock)"
    recommendation: "Diferir a sdd-apply, mismo patrón usado para architect:flow:edit en update-flow"
    confirmed: false
