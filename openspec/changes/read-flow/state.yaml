change: read-flow
created: 2026-07-16
execution_mode: interactive
artifact_store: openspec
delivery_strategy: ask-on-risk
chain_strategy: stacked-to-main

phases:
  explore:
    status: done
    note: >
      No exploration.md file was created for this change (deliberately,
      per user request). Full exploration summary was captured inline in
      the sdd-propose launch prompt and used as the sole source for this
      proposal — no persisted exploration artifact exists.
    artifact: none
  proposal:
    status: done
    artifact: openspec/changes/read-flow/proposal.md
  specs:
    status: done
    artifact: openspec/changes/read-flow/specs/read-flow/spec.md
  design:
    status: done
    artifact: openspec/changes/read-flow/design.md
  tasks:
    status: done
    artifact: openspec/changes/read-flow/tasks.md
    note: >
      3 work units (Slice A core / Slice B tool MCP / Slice C docs+empirical),
      not 2 like update-flow — read-flow.ts alone (mirrors update-flow.ts's
      spawn+NDJSON boilerplate) plus its own tools/list schema test already
      rounds ~360-400 lines; adding docs on top would risk exceeding the
      400-line budget. Precedent: update-flow's own Slice B was split into
      2 PRs (code vs docs) mid-apply for the same reason (see
      update-flow/state.yaml apply note) — planning the 3rd slice up front
      here instead of discovering it during apply.
  apply:
    status: done
    note: >
      Slice A (Phase 1, tasks 1.1-1.6) complete on branch
      feat/read-flow-slice-a: truncateContent() helper + tests (16/16
      green), readFlow() + `--mode read` in the deploy-runner, empirically
      verified against the real "Calidda" org (same disposable test flow
      used by update-flow: ZZZ-SDD-Test-DoNotUse-UpdateFlow, flowId
      69cd3550-0848-4fd7-a5c7-4be615b20ced). Confirmed: (a) full valid
      YAML export (2297 chars, well under MAX_YAML_CHARS, truncated:false),
      (b) NO lock acquired — a --mode update checkout run immediately
      after the read succeeded cleanly against the same flow, proving
      loadFlowByFlowIdAsync never took a lock for readFlow to leave
      behind. Also confirmed empirically: not-found classification works
      unchanged in read mode; flowVersion:"published" against a
      never-published flow errors explicitly ("... version 'published' is
      missing. (not.found)") rather than silently falling back, though
      classifyUpdateError() currently files this under "unknown" (regex
      doesn't match the literal "(not.found)" pattern) — left for Slice C
      to re-confirm end-to-end and decide if it needs its own errorKind.
      architect:flow:view permission still NOT isolated (same limitation
      already documented for update-flow's architect:flow:edit) — all
      calls succeeded under the org's current OAuth client role, deferred
      to Slice C per open_decisions.architect-flow-view-permission.

      Deviation from design.md found during verification: exportToObjectAsync's
      awaited Promise value was undefined against a real flow even though
      the SDK logged successful export generation — the real
      {content, fileName} only arrives via the callback parameter.
      readFlow() reads it from there instead of the awaited return value.

      IMPORTANT branch-base correction: the orchestrator's instruction to
      branch from origin/main was factually incorrect — update-flow (PRs
      #1-3) is NOT merged into main (verified: commit 0382e5e is not an
      ancestor of origin/main or local main; main's index.ts has no mode
      dispatch or update-helpers.ts). sdd-apply created feat/read-flow-slice-a
      from feat/update-flow-slice-b-docs (the full 3-PR update-flow stack)
      since that's where resolveFlowIdentifier and the mode dispatch exist.

      Orchestrator follow-up (post-apply, same session): verified that
      update-helpers.ts, update-helpers.test.ts, index.ts, and
      bin/deploy-runner.js are byte-identical between feat/update-flow-slice-a
      (PR #1, already CI-green after the trailing-comma ci.yml fix) and
      feat/update-flow-slice-b-docs (PR #3 tip) — Slices B/C of update-flow
      only touched the MCP tool layer and skill docs, never the deploy-runner.
      So read-flow's Slice A only genuinely depends on PR #1, not the full
      stack. Ran `git rebase --onto feat/update-flow-slice-a
      feat/update-flow-slice-b-docs feat/read-flow-slice-a` — clean,
      zero conflicts (identical trees on the touched files), new commit
      SHAs 319c433/6dba9e3/cf39948. Re-ran pnpm test (16/16), pnpm exec tsc
      --noEmit (0 errors), pnpm run build (clean) post-rebase to confirm
      no regression. feat/read-flow-slice-a now depends only on
      feat/update-flow-slice-a — its eventual PR should target
      feat/update-flow-slice-a (PR #1's branch) rather than the full
      update-flow stack, and can be re-targeted to main directly once
      PR #1 merges.

      Slice B (Phase 2, tasks 2.1-2.4) complete, same branch
      feat/read-flow-slice-a: src/mcp-server/tools/read-flow.ts (flat
      ZodRawShape, no .refine(), spawn+NDJSON mirroring update-flow.ts,
      readOnlyHint:true/destructiveHint:false), registered in
      src/mcp-server/index.ts, and src/mcp-server/tools/read-flow.test.ts
      (McpServer+Client over InMemoryTransport, 6 tests: tools/list schema
      shape + required + annotations, callTool cross-field validation with
      2 distinct messages). pnpm test 26/26 green (20 prior + 6 new), tsc
      --noEmit 0 errors, build clean, lint clean.

      Deviation (branch-state, not a design flaw): design.md says to
      register read_flow immediately after update_flow in index.ts, but
      update_flow (update-flow's Slice B) does not exist on this branch —
      feat/read-flow-slice-a only depends on feat/update-flow-slice-a
      (Slice A/PR #1, deploy-runner core only), per the branch-base
      correction already recorded above for Slice A. read_flow was
      registered after test_bot_flow (the last existing tool on this
      branch) with an inline comment flagging the pending re-order once
      both branches converge — update-flow.ts was deliberately NOT
      cherry-picked in to avoid duplicating another PR's work here.

      Bugfix found and applied (blocking task 2.4's own verification, not
      scope creep): package.json's "test" script
      (`node --experimental-strip-types --test src/**/*.test.ts`) relied on
      shell globstar expansion that plain `sh` (what npm/pnpm scripts run
      under) does not support recursively — it silently matched only
      src/deploy-runner/*.test.ts (1 level deep) and skipped
      src/mcp-server/tools/read-flow.test.ts (2 levels deep) with exit 0,
      no error. Fixed to
      `node --experimental-strip-types --test $(find src -name '*.test.ts' | sort)`,
      verified to pick up all 26 tests with no false positives (Node's own
      `--test` auto-discovery without an explicit path was tried first but
      rejected — it accidentally executes src/mcp-server/tools/test-bot-flow.ts
      as an empty test suite because its filename matches Node's default
      `test-*` naming convention, an unrelated false positive). Note:
      .github/workflows/ci.yml on this branch (inherited from
      update-flow-slice-a) does not invoke `pnpm test` yet — that step was
      only added in update-flow-slice-b-docs (commit f316a2e, not yet on
      this branch) — so this bug was not silently breaking CI today, but
      would have affected local verification and any future CI once
      branches converge.

      Slice C (Phase 3, tasks 3.1-3.4) complete, same branch
      feat/read-flow-slice-a: skills/write-flow/SKILL.md ("Reading an
      Existing Flow Before Editing It" section, standalone — see branch-state
      deviation below), skills/write-flow/references/sdk-patterns.md ("The
      `read_flow` Contract" section), skills/write-flow/references/gotchas.md
      (truncation + flowVersion sections). Final empirical verification
      (task 3.4) run against the real "Calidda" org via the actual MCP tool
      handler (src/mcp-server/tools/read-flow.ts's `handler`, invoked
      directly with real args, spawning a freshly rebuilt bin/deploy-runner.js
      — not the deploy-runner bypass used in 1.6):
      (a) full valid YAML confirmed via the real tool (2297 chars, identical
      to 1.6's bypass result); (b) no lock left behind confirmed — an
      immediate --mode update checkout (deploy-runner directly, since
      update_flow's own MCP tool still doesn't exist on this branch, same
      limitation as 2.2) succeeded cleanly; (c) architect:flow:view
      permission still NOT isolated, same limitation already documented for
      update-flow's architect:flow:edit — all calls succeeded under the
      org's current OAuth client role, which confirms sufficiency but not
      the exact minimal permission name; left explicitly unconfirmed rather
      than guessed (see open_decisions below); (d) flowVersion:"published"
      against the never-published test flow confirmed end-to-end through the
      real tool: identical behavior to 1.6's bypass finding — an explicit SDK
      404 ("... version 'published' is missing. (not.found)"), classified as
      errorKind:"unknown" (not "not-found") due to the classifyUpdateError
      regex gap already documented, left as a documented finding rather than
      a fix per design.md's scope. Bonus: not-found classification also
      reconfirmed via the real tool.

      Branch-state deviation (SKILL.md, task 3.1): the instruction assumed an
      existing "Updating an Existing Flow" section in SKILL.md to nest the
      read_flow note under. That section is part of update-flow's Slice C
      docs (commit f19d983, branch feat/update-flow-slice-b-docs), not merged
      into this branch (same root cause as the branch-base correction already
      recorded above for Slices A/B). Added a standalone
      "Reading an Existing Flow Before Editing It" section instead, with an
      explicit note on where to fold it once branches converge.

      All 3 slices of read-flow (Phase 1 core, Phase 2 tool MCP, Phase 3
      docs+verification) are now complete on feat/read-flow-slice-a.

      Post-verify gap closure (sdd-apply, same session as the sdd-verify
      pass below, task 3.5 added to tasks.md): the 1 CRITICAL + 2 WARNING
      empirical gaps sdd-verify found were closed with 5 additional
      read_flow calls against the real "Calidda" org, same disposable flow
      (ZZZ-SDD-Test-DoNotUse-UpdateFlow, flowId
      69cd3550-0848-4fd7-a5c7-4be615b20ced), invoked via the actual tool
      handler (readFlow(toolConfig).handler(...) imported from
      src/mcp-server/tools/read-flow.ts, spawning a freshly rebuilt
      bin/deploy-runner.js — same end-to-end pattern as task 3.4, no
      deploy-runner bypass). None of these 5 calls used --mode update, so
      unlike 1.6/3.4 this round left the flow's internal version number
      unchanged. Findings: (1) CRITICAL — flowName + wrong flowType
      ("outboundcall" instead of "inboundcall") confirmed to fold into
      errorKind:"not-found", exactly as spec.md anticipated by analogy with
      update_flow; (2) WARNING — flowName + correct flowType confirmed to
      return byte-identical YAML via the real loadFlowByFlowNameAsync code
      path, previously only unit-tested at the resolveFlowIdentifier level;
      (3) WARNING — flowVersion:"debug" was exercised for the first time
      (failed with an explicit SDK 404, "version 'debug' is missing.
      (not.found)" — this test flow never had an active debug session, a
      real finding not a code bug) and flowVersion:"3.0" (an explicit
      numeric version taken from the flow's own previously-observed
      fileName, not invented) succeeded with identical YAML, closing the
      last untested branch of the "Default and valid explicit versions"
      scenario. No production code changes were needed — all 3 findings
      confirmed expected/anticipated behavior. specs/read-flow/spec.md
      updated: the "flowType mismatch" scenario no longer says "(unverified)"
      and the "Default and valid explicit versions" scenario now documents
      the confirmed evidence for all 4 flowVersion values (2 full success,
      2 confirmed-failure-only because this specific disposable flow has
      no published/debug version to succeed against). tasks.md 1.2's stale
      "16 tests" note was also corrected to reflect the file's real current
      count (20) as a cosmetic, non-blocking fix (SDD-verify SUGGESTION).
  verify:
    status: done
    artifact: openspec/changes/read-flow/verify-report.md
    note: >
      PASS WITH WARNINGS. 14/14 tasks genuinely implemented (verified against
      code, not just checkbox state). pnpm test 26/26 green, tsc --noEmit 0
      errors, lint clean, build clean. Note: spec.md actually has 7
      Requirements / 12 Scenarios (grep-counted), not 8/15 as assumed going
      in. 10/12 scenarios COMPLIANT with real test/empirical evidence.

      1 CRITICAL: the "flowType mismatch" scenario (Flow Not Found Handling)
      has spec.md's own explicit MUST-verify language ("MUST be confirmed
      empirically during sdd-apply, not assumed") but no empirical evidence
      exists in tasks.md 1.6/3.4 of a flowName+wrong-flowType call — both
      empirical rounds used --flow-id exclusively. Unlike
      architect-flow-view-permission (honestly left confirmed:false with a
      documented reason), this gap is not surfaced anywhere as still-open.

      2 WARNING: (a) "Resolve by flowName and flowType" scenario — the
      readFlow() -> loadFlowByFlowNameAsync code path was never exercised by
      any test or empirical run, only resolveFlowIdentifier's pure byName
      branch is unit-tested; (b) "Default and valid explicit versions"
      scenario — only omitted/"latest" (success) and "published" (failure
      branch only) were empirically confirmed; "debug" and an explicit
      numeric commit-version were never tested in either branch.

      1 SUGGESTION (cosmetic, non-blocking): tasks.md 1.2's test count ("16
      tests") is stale relative to the file's current 20 tests after 2.4's
      b218a57 additions; 2.4/3.4's rollup (20+6=26) is accurate and matches
      the real pnpm test run.

      All 3 previously-known design.md deviations (exportToObjectAsync
      callback quirk, open flowVersion validation, post-test_bot_flow
      registration) confirmed correctly reflected in code. spec.md/design.md
      .refine() contradiction (commit b2e1005) confirmed genuinely fixed, no
      other artifact contradictions found. All 5 state.yaml open_decisions
      confirmed to match actual implementation, including
      architect-flow-view-permission's honest confirmed:false.

      Recommendation before archive: close the CRITICAL + 2 WARNINGs with
      ~3-4 additional empirical calls against the same disposable test flow
      (ZZZ-SDD-Test-DoNotUse-UpdateFlow) rather than a full sdd-apply re-run:
      flowName+wrong-flowType, flowName+correct-flowType,
      --flow-version debug, --flow-version <explicit number>.

      Re-verification (sdd-verify, this session, HEAD cbffcdc, after
      sdd-apply task 3.5 closed the gaps above): independently confirmed
      the CRITICAL + 2 WARNING + 1 SUGGESTION are genuinely closed, not
      just claimed closed. Cross-checked spec.md's updated scenarios
      against tasks.md 3.5's evidence (same flowId, same flowName, same
      errorKind values, same flowVersion numbers — no contradictions).
      Re-ran pnpm test (26/26), tsc --noEmit (0 errors), lint (clean),
      build (clean) myself rather than trusting the prior report. Verdict
      updated to PASS WITH WARNINGS (0 CRITICAL, 0 blocking WARNING).

      New non-blocking SUGGESTION found (pre-existing, not introduced by
      cbffcdc, confirmed via git show cbffcdc -- spec.md that these 2
      scenarios were untouched by the closing commit): spec.md's "Invalid
      version value rejected by the SDK" and "Published requested but
      none exists (unverified)" scenarios still carry stale
      "(unverified)"/"MUST be confirmed" language even though their
      evidence already exists in tasks.md 1.6/3.4d (errorKind:"unknown"
      confirmed, explicit SDK error confirmed instead of silent
      fallback) — was already scored COMPLIANT in the original verify
      matrix rows 8-9 despite the stale text. Cosmetic text-only fix
      recommended, does not block archive.
  archive:
    status: pending
    note: >
      PR #4 (feat/read-flow-slice-a -> main) merged via merge commit,
      SHA dbc7598. Required resolving a real merge conflict discovered
      only at PR-open time (mergeable: CONFLICTING) — feat/read-flow-slice-a
      branched before update-flow's Slice B/C existed on this branch, so
      both stacks independently touched package.json's "test" script,
      SKILL.md, sdk-patterns.md, and src/mcp-server/index.ts's tool
      registration. Resolved by hand: kept both package.json script
      additions (typecheck from update-flow + the test glob fix from
      read-flow), folded "Reading an Existing Flow Before Editing It"
      into "Updating an Existing Flow" in SKILL.md per the standalone
      section's own note, merged both SDK contract sections in
      sdk-patterns.md (updateFlow first, read_flow second), and
      re-ordered read_flow's registration to immediately follow
      update_flow in index.ts per design.md's original intent (the
      stale "not present on this branch" comment no longer applied).
      Rebuilt both bundles, re-ran pnpm test (26/26), tsc --noEmit
      (0 errors), lint, build — all clean post-merge, both locally and
      via real CI on the pushed merge commit before merging the PR.

open_decisions:
  - id: tool-name
    question: "Nombre del nuevo tool MCP de solo lectura (candidatos: get_flow, read_flow, export_flow)"
    recommendation: "read_flow"
    confirmed: true
    decision: "read_flow"
  - id: flow-format-param
    question: "¿Exponer flowFormat como parámetro (yaml/architect) o fijarlo siempre en yaml?"
    recommendation: "Solo yaml — no exponer 'architect' como opción, sin caso de uso claro para este propósito"
    confirmed: true
    decision: "yaml-fixed-not-exposed"
  - id: size-guard-strategy
    question: "Estrategia de guard de tamaño para flows grandes/complejos exportados a YAML"
    recommendation: "Diferir a sdd-design/sdd-spec, no bloquea el proposal"
    confirmed: true
    decision: "truncate-at-MAX_YAML_CHARS-200000-with-truncated-flag; starting value to validate empirically in sdd-apply"
  - id: resolve-flow-identifier-sharing
    question: "Reutilizar resolveFlowIdentifier tal cual (update-helpers.ts) vs. extraerlo a un módulo neutral compartido entre read y update"
    recommendation: "Diferir a sdd-design; decisión menor, solo 2 consumidores hoy"
    confirmed: true
    decision: "reuse-as-is-from-update-helpers-no-extraction"
  - id: architect-flow-view-permission
    question: "Confirmar empíricamente que loadFlowBy...Async solo requiere architect:flow:view (no edit/unlock)"
    recommendation: "Diferir a sdd-apply, mismo patrón usado para architect:flow:edit en update-flow"
    confirmed: false
    decision: >
      NOT isolated — same limitation already documented for update-flow's
      architect:flow:edit (update-flow/tasks.md 2.6). Verified empirically
      in read-flow/tasks.md 3.4c against the real "Calidda" org, via the
      actual read_flow MCP tool: every call (successful reads, not-found,
      and the flowVersion:"published" error case) succeeded under the org's
      current OAuth client role, which confirms the role's permissions are
      SUFFICIENT for read_flow but does not isolate the exact minimal
      permission name. Isolating it would require a second, deliberately
      under-permissioned OAuth client/role to test against — out of scope
      for a solo verification pass. Left honestly unconfirmed rather than
      assuming architect:flow:view is the answer.
