schema: spec-driven

context: |
  Genesys Cloud Architect: Claude Code plugin (Node.js/TS, pnpm workspace).
  MCP server (src/mcp-server -> servers/*.js, 3 tools) + standalone
  deploy-runner (src/deploy-runner -> bin/deploy-runner.js) using the
  Architect Scripting SDK, plus 2 skills (flow-diagram, write-flow).
  Build: esbuild (CJS/node22). Lint/format: Biome 2.4.15 (src/** only).
  Validation: zod v4 (via zod/v3 compat imports). Types: tsc strict,
  noEmit, NOT wired into CI/pre-commit (config-only, unenforced today).
  Testing: node:test via `pnpm test` (node --experimental-strip-types
  --test), 3 passing test files today (src/deploy-runner/update-helpers.test.ts,
  src/mcp-server/tools/read-flow.test.ts,
  src/mcp-server/tools/update-flow.test.ts). CI = lint + build + MCP
  boot/smoke test only (pnpm test is not yet wired into CI). Bundles
  (bin/deploy-runner.js, servers/*.js) are committed and rebuilt +
  re-staged by husky pre-commit on every commit.

testing:
  strict_tdd: true
  test_command: "pnpm test"
  reason: >
    node:test is installed and wired via a "test" script
    (node --experimental-strip-types --test $(find src -name
    '*.test.ts' | sort)) — no external test runner dependency needed.
    3 passing test files exist today: update-helpers.test.ts,
    read-flow.test.ts, update-flow.test.ts. CI still only runs lint +
    build + a smoke test that boots the MCP server and checks
    tools/list responds — `pnpm test` is not yet wired into CI, so
    Strict TDD is enforced at the sdd-apply/sdd-verify level, not by
    CI. New pure/testable logic (parsers, helpers) MUST follow RED
    (failing node:test) before GREEN (implementation); thin MCP tool
    handlers wiring the Genesys SDKs remain covered by empirical
    verification against a real org per this project's existing
    convention (see update-flow's and update-flow-safeguards' design
    docs), not by mocking the SDK.
  coverage:
    available: false
    command: ""
  quality_tools:
    linter:
      available: true
      command: "pnpm run lint"
    type_checker:
      available: false
      note: "tsc is configured (strict, noEmit) but not wired into any script, CI step, or pre-commit hook"
    formatter:
      available: true
      command: "pnpm run format"

rules:
  proposal:
    - Include rollback plan for risky changes, especially anything touching deploy-flow.ts or deploy-runner (destructiveHint: true, pushes live changes to a Genesys Cloud org)
    - Flag any change that adds a test runner or CI step as high-value given the current zero-test baseline
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Call out the MCP server <-> deploy-runner NDJSON protocol explicitly when a change touches either side (no shared schema/type module exists today)
  design:
    - Document architecture decisions with rationale
    - For changes to the 3 MCP tools, document the zod schema (zod/v3 compat imports) and note when validation should move from post-parse `if` checks to `.refine()`
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - If a task adds tests, prefer vitest or node:test per the testing.reason guidance above
  apply:
    - Follow existing code patterns (thin MCP tool handlers, SDK interop isolated to deploy-runner/index.ts)
    tdd: true # node:test is installed and wired via `pnpm test` — see testing.reason
    test_command: "pnpm test"
    - Do not silently swallow errors the way flow-dependencies.ts currently does (collapses all errors to "not found") — surface real error types when touching that code
  verify:
    test_command: "pnpm test"
    build_command: "pnpm run build"
    coverage_threshold: 0
    - lint_command: "pnpm run lint"
  archive:
    - Warn before merging destructive deltas
    - Version bumps (package.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json) are currently manual/hand-duplicated — flag drift if a change touches versioning
